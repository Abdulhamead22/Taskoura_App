name: flutter_application_1
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#F8FAFC"
  image: assets/image/logo_Taskora.png
  android: true
  ios: true
  android_12:
    color: "#F8FAFC"
    image: assets/image/logo_Taskora.png
    
flutter:
  uses-material-design: true

  assets:
    - assets/image/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400

        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500

        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700  